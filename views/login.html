<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ล็อกอินแผงผู้ดูแล · MTB Endless Ride</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11131c; color: #e8eaf0; font: 400 15px/1.5 Kanit, "Noto Sans Thai", Tahoma, sans-serif; padding: 16px; }
    form { width: 100%; max-width: 340px; background: #1a1e2b; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 22px; }
    h1 { font-size: 19px; margin: 0 0 4px; font-weight: 800; }
    p { margin: 0 0 14px; color: #8f96a8; font-size: 13px; }
    input { width: 100%; padding: 10px 12px; background: #222738; color: #fff; border: 1px solid #444; border-radius: 10px; font: 500 15px Kanit, sans-serif; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #f06292; color: #fff; font: 700 15px Kanit, sans-serif; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    #msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: #ff8a80; }
    a { color: #80d8ff; font-size: 13px; }
  </style>
</head>
<body>
<form id="f">
  <h1>🔒 แผงผู้ดูแล</h1>
  <p>ใส่รหัสผ่านผู้ดูแล (ตั้งไว้ที่ <b>adminPassword</b> ใน config.json ของเครื่องที่รันเกม)</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" required autofocus>
  <button id="go">เข้าสู่ระบบ</button>
  <div id="msg"></div>
  <a href="/">← กลับไปหน้าเกม</a>
</form>
<script>
'use strict';
const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault();
  go.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    const j = await r.json();
    if (j.ok) { location.reload(); return; }
    msg.textContent = j.msg || 'เข้าสู่ระบบไม่ได้';
  } catch (err) { msg.textContent = 'ติดต่อเซิร์ฟเวอร์ไม่ได้'; }
  go.disabled = false;
});
</script>
</body>
</html>
