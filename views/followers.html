<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ผู้ติดตามล่าสุด · MTB Endless Ride</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #11131c; --card: #1a1e2b; --line: rgba(255, 255, 255, 0.08); --text: #e8eaf0; --dim: #8f96a8; --pink: #f06292; --ok: #5fd38a; --gold: #ffd54f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 13px/1.45 Kanit, "Noto Sans Thai", Tahoma, sans-serif; }
    main { max-width: 620px; margin: 0 auto; padding: 12px 14px 40px; }
    h1 { font-size: 17px; margin: 0 0 10px; font-weight: 800; }
    .sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
    .sum div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
    .sum b { display: block; font-size: 22px; font-weight: 800; }
    .sum span { color: var(--dim); font-size: 12px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .tabs button { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 4px 12px; font: 600 13px Kanit, sans-serif; cursor: pointer; }
    .tabs button.on { background: rgba(240, 98, 146, 0.3); border-color: var(--pink); }
    input { width: 100%; padding: 7px 10px; margin-bottom: 8px; background: #222738; color: #fff; border: 1px solid #444; border-radius: 10px; font: 500 13px Kanit, sans-serif; }
    .row { display: grid; grid-template-columns: 26px 40px 1fr auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; margin-bottom: 6px; }
    .row.new { animation: flash 2.5s ease-out; }
    @keyframes flash { from { background: rgba(240, 98, 146, 0.45); } to { background: var(--card); } }
    .n { color: var(--gold); font-weight: 800; text-align: center; }
    .av { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #455a64; display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #fff; }
    .nm { min-width: 0; }
    .nm b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nm small { color: var(--dim); }
    .bd { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; margin-right: 4px; background: rgba(255, 255, 255, 0.08); }
    .bd.new { background: rgba(240, 98, 146, 0.3); } .bd.race { background: rgba(95, 211, 138, 0.25); } .bd.test { background: rgba(255, 193, 7, 0.22); }
    .t { text-align: right; color: var(--dim); font-size: 12px; white-space: nowrap; }
    .t b { color: var(--text); font-weight: 600; display: block; }
    .empty, .note { color: var(--dim); text-align: center; padding: 14px; }
    .note { font-size: 11px; padding: 6px; }
  </style>
</head>
<body>
<main>
  <h1>👥 ผู้ติดตามล่าสุด</h1>
  <div class="sum">
    <div><b id="sTotal">–</b><span>ผู้ติดตามทั้งหมด</span></div>
    <div><b id="sLive">–</b><span>ไลฟ์นี้</span></div>
    <div><b id="sRace">–</b><span>อยู่ในสนามตอนนี้</span></div>
  </div>
  <div class="tabs">
    <button data-f="all" class="on">ทั้งหมด</button>
    <button data-f="live">ไลฟ์นี้</button>
    <button data-f="race">ในสนาม</button>
  </div>
  <input id="q" type="search" placeholder="🔎 ค้นหาชื่อ หรือ @บัญชี" autocomplete="off">
  <div id="list"><div class="empty">กำลังโหลด…</div></div>
  <div class="note" id="note"></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let filter = 'all', data = null, known = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function ago(t) {
  if (!t) return '';
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return `${s} วิที่แล้ว`;
  if (s < 3600) return `${Math.floor(s / 60)} นาทีที่แล้ว`;
  if (s < 86400) return `${Math.floor(s / 3600)} ชม.ที่แล้ว`;
  return `${Math.floor(s / 86400)} วันที่แล้ว`;
}
function clock(t) {
  if (!t) return '';
  const d = new Date(t), today = new Date().toDateString() === d.toDateString();
  return (today ? '' : `${d.getDate()}/${d.getMonth() + 1} `) + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
}
function avatar(f) {
  const ch = esc((Array.from(String(f.nickname || f.uniqueId || '?').replace(/^@/, ''))[0] || '?').toUpperCase());
  return f.avatar ? `<img class="av" src="${esc(f.avatar)}" referrerpolicy="no-referrer" alt="" onerror="this.outerHTML='<div class=&quot;av&quot;>${ch}</div>'">` : `<div class="av">${ch}</div>`;
}
function render() {
  if (!data) return;
  $('sTotal').textContent = data.total; $('sLive').textContent = data.session; $('sRace').textContent = data.roster;
  const q = $('q').value.trim().toLowerCase();
  let l = data.list;
  if (filter === 'live') l = l.filter(f => f.live);
  if (filter === 'race') l = l.filter(f => f.inRace);
  if (q) l = l.filter(f => String(f.nickname).toLowerCase().includes(q) || String(f.uniqueId).toLowerCase().includes(q));
  const first = known === null;
  if (first) known = new Set();
  $('list').innerHTML = l.length ? l.map((f, i) => {
    const isNew = !first && !known.has(f.uniqueId);
    const badges = [
      f.live ? (f.already ? '<span class="bd">💖 ติดตามอยู่แล้ว</span>' : '<span class="bd new">🆕 กดติดตามใหม่</span>') : '',
      f.inRace ? '<span class="bd race">🚴 ในสนาม</span>' : '',
      f.test ? '<span class="bd test">🧪 ทดสอบ</span>' : '',
    ].join('');
    const dm = f.diamondsNow || f.diamonds || 0;
    return `<div class="row${isNew ? ' new' : ''}"><div class="n">${i + 1}</div>${avatar(f)}
      <div class="nm"><b>${esc(f.nickname || f.uniqueId)}</b><small>@${esc(f.uniqueId)}</small><div>${badges}</div></div>
      <div class="t"><b>${clock(f.at)}</b>${ago(f.at)}${dm ? `<br>💎 ${dm}` : ''}</div></div>`;
  }).join('') : '<div class="empty">ยังไม่มีผู้ติดตาม</div>';
  for (const f of data.list) known.add(f.uniqueId);
  $('note').textContent = `อัปเดตทุก 3 วินาที · ${data.ok ? 'รวมประวัติจากฐานข้อมูล' : '⚠️ ฐานข้อมูลไม่ได้เชื่อม (เปิด MySQL ใน XAMPP) — แสดงเฉพาะไลฟ์นี้'}`;
}
function poll() {
  fetch('/followers/recent?limit=100', { cache: 'no-store' }).then(r => r.json()).then(d => { data = d; render(); })
    .catch(() => { $('note').textContent = '⚠️ ติดต่อเซิร์ฟเวอร์ไม่ได้ — เปิด node server.js ก่อน'; });
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
}));
$('q').addEventListener('input', render);
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
